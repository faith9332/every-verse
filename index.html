<!doctype html>
<html lang="en">
<head>
<meta charset="utf-8">
<meta name="viewport" content="width=device-width, initial-scale=1, viewport-fit=cover">
<title>Every Verse</title>
<meta name="description" content="A Bible reading tracker and journal. Tick off every chapter, log the dates you read, and keep notes.">
<meta name="apple-mobile-web-app-capable" content="yes">
<meta name="mobile-web-app-capable" content="yes">
<meta name="apple-mobile-web-app-title" content="Every Verse">
<meta name="apple-mobile-web-app-status-bar-style" content="default">
<meta name="theme-color" content="#F3EEE5" media="(prefers-color-scheme: light)">
<meta name="theme-color" content="#14110D" media="(prefers-color-scheme: dark)">
<meta name="color-scheme" content="light dark">
<link rel="manifest" href="manifest.webmanifest">
<link rel="icon" href="icon-192.png" type="image/png">
<link rel="apple-touch-icon" href="apple-touch-icon.png">
<style>
/* Layout: one phone-width column, large serif titles, grouped cards, fixed bottom tab bar. */
:root {
  --bg: #F3EEE5;
  --surface: #FFFCF6;
  --sunk: #EAE2D4;
  --ink: #2A231C;
  --muted: #776A5C;
  --line: #DCD1C1;
  --accent: #8A5A20;
  --on-accent: #FFFFFF;
  --accent-soft: #EEE0C9;
  --danger: #A8352B;
  --bar: rgba(255, 252, 246, 0.92);
  --shadow: 0 1px 2px rgba(60, 40, 15, 0.06), 0 4px 16px rgba(60, 40, 15, 0.05);
  --serif: ui-serif, "New York", "Iowan Old Style", "Palatino Linotype", Palatino, Georgia, serif;
  --sans: -apple-system, BlinkMacSystemFont, system-ui, "Segoe UI", Roboto, "Helvetica Neue", Arial, sans-serif;
  --radius: 16px;
}
@media (prefers-color-scheme: dark) {
  :root:not([data-theme="light"]) {
    --bg: #14110D; --surface: #211C16; --sunk: #2B241D; --ink: #F2E9DC; --muted: #A79784;
    --line: #3B3229; --accent: #D9A65E; --on-accent: #1F170E; --accent-soft: #3A2D1E; --danger: #E36B5F;
    --bar: rgba(33, 28, 22, 0.92); --shadow: 0 1px 2px rgba(0,0,0,0.3); color-scheme: dark;
  }
}
:root[data-theme="dark"] {
  --bg: #14110D; --surface: #211C16; --sunk: #2B241D; --ink: #F2E9DC; --muted: #A79784;
  --line: #3B3229; --accent: #D9A65E; --on-accent: #1F170E; --accent-soft: #3A2D1E; --danger: #E36B5F;
  --bar: rgba(33, 28, 22, 0.92); --shadow: 0 1px 2px rgba(0,0,0,0.3); color-scheme: dark;
}
html, body { margin: 0; }
:root { padding-top: env(safe-area-inset-top, 0px); }
img { max-width: 100%; }
[hidden] { display: none !important; }
#print { display: none; }
@media print {
  body > *:not(#print) { display: none !important; }
  body::before { display: none; }
  :root { padding: 0; }
  body { background: #fff; color: #1d1712; }
  #print { display: block; font-family: var(--sans); font-size: 11pt; line-height: 1.45; }
  #print h1 { font-family: var(--serif); font-size: 26pt; margin: 0 0 2pt; }
  #print h2 { font-family: var(--serif); font-size: 16pt; margin: 20pt 0 6pt; padding-bottom: 3pt; border-bottom: 1px solid #d9cfc2; break-after: avoid; }
  #print h3 { font-family: var(--serif); font-size: 12pt; margin: 11pt 0 1pt; break-after: avoid; }
  #print .pm { color: #6f6458; font-size: 9.5pt; margin: 0; }
  #print .pn { margin: 4pt 0 0; padding: 6pt 10pt; background: #f6f1e8; border-left: 3px solid #8A5A20; white-space: pre-wrap; break-inside: avoid; }
  #print table { margin-top: 8pt; border-collapse: collapse; }
  #print td { padding: 1pt 14pt 1pt 0; }
}
@supports (font: -apple-system-body) { html { font: -apple-system-body; } }
html { -webkit-text-size-adjust: 100%; }
body {
  background: var(--bg); color: var(--ink); font-family: var(--sans); font-size: 1rem; line-height: 1.4;
  -webkit-tap-highlight-color: transparent;
}
body::before { content: ""; position: fixed; inset: 0 0 auto; height: env(safe-area-inset-top, 0px); z-index: 10; background: var(--bg); }
* { box-sizing: border-box; }
button, input, select, textarea { font: inherit; color: inherit; }
button { background: none; border: 0; padding: 0; cursor: pointer; text-align: inherit; }
:focus-visible { outline: 2.5px solid var(--accent); outline-offset: 2px; border-radius: 8px; }
.wrap {
  max-width: 600px; margin: 0 auto;
  padding-left: max(16px, env(safe-area-inset-left, 0px));
  padding-right: max(16px, env(safe-area-inset-right, 0px));
  padding-block: 0 calc(96px + env(safe-area-inset-bottom, 0px));
}
.wrap.has-chapter-bar { padding-block-end: calc(150px + env(safe-area-inset-bottom, 0px)); }

/* Top bar */
.topbar {
  position: sticky; top: env(safe-area-inset-top, 0px); z-index: 5; background: var(--bg);
  display: grid; grid-template-columns: 1fr auto 1fr; align-items: center; min-height: 48px; margin: 0 -4px;
}
.topbar .title { font-family: var(--serif); font-weight: 600; font-size: 1.05rem; text-align: center; white-space: nowrap; overflow: hidden; text-overflow: ellipsis; max-width: 52vw; }
.back { display: inline-flex; align-items: center; gap: 2px; color: var(--accent); min-height: 44px; padding-right: 8px; font-size: 1rem; max-width: 30vw; white-space: nowrap; overflow: hidden; text-overflow: ellipsis; }
.back svg { flex: none; }
.topbar .right { justify-self: end; }
.iconbtn { width: 44px; height: 44px; display: inline-grid; place-items: center; color: var(--accent); border-radius: 12px; }
h1.large { font-family: var(--serif); font-size: 2.1rem; font-weight: 700; letter-spacing: -0.01em; margin: 8px 0 14px; text-wrap: balance; }

/* Cards & groups */
.card { background: var(--surface); border-radius: var(--radius); padding: 16px; box-shadow: var(--shadow); }
.stack { display: flex; flex-direction: column; gap: 16px; }
.group { background: var(--surface); border-radius: var(--radius); overflow: hidden; box-shadow: var(--shadow); }
.group > * + * { border-top: 0.5px solid var(--line); }
.sec-h { display: flex; justify-content: space-between; align-items: baseline; margin: 22px 4px 8px; }
.sec-h h2 { font-family: var(--serif); font-size: 1.3rem; font-weight: 600; margin: 0; }
.sec-h span, .muted { color: var(--muted); }
.small { font-size: 0.82rem; }
.tnum { font-variant-numeric: tabular-nums; }

/* Progress bar & ring */
.bar { height: 6px; border-radius: 99px; background: var(--accent-soft); overflow: hidden; }
.bar > i { display: block; height: 100%; background: var(--accent); border-radius: 99px; transition: width .4s ease; }
.ring { position: relative; display: grid; place-items: center; }
.ring svg { position: absolute; inset: 0; transform: rotate(-90deg); }
.ring circle { fill: none; }
.ring .track { stroke: var(--accent-soft); }
.ring .val { stroke: var(--accent); stroke-linecap: round; transition: stroke-dashoffset .6s ease; }

/* Home */
.continue { display: flex; flex-direction: column; gap: 16px; }
.continue .top { display: flex; align-items: center; gap: 16px; }
.continue h2 { font-family: var(--serif); font-size: 1.25rem; margin: 0 0 2px; font-weight: 600; }
.btn-primary {
  display: flex; align-items: center; gap: 12px; width: 100%; min-height: 56px; padding: 10px 16px;
  background: var(--accent); color: var(--on-accent); border-radius: 14px; font-weight: 600;
}
.btn-primary .lbl { flex: 1; display: flex; flex-direction: column; text-align: left; line-height: 1.2; }
.btn-primary .lbl small { font-size: 0.8rem; font-weight: 500; opacity: 0.85; }
.btn-primary .lbl b { font-family: var(--serif); font-size: 1.1rem; }
.search { display: flex; align-items: center; gap: 8px; background: var(--sunk); border-radius: 12px; padding: 0 12px; margin-top: 18px; min-height: 44px; color: var(--muted); }
.search input { border: 0; background: none; outline: none; flex: 1; min-width: 0; min-height: 44px; color: var(--ink); }
.search input::placeholder { color: var(--muted); }
.book-row { display: flex; align-items: center; gap: 14px; width: 100%; padding: 12px 14px; min-height: 72px; }
.emoji-tile { width: 46px; height: 46px; flex: none; border-radius: 12px; background: var(--accent-soft); display: grid; place-items: center; font-size: 1.5rem; }
.book-row .mid { flex: 1; min-width: 0; display: flex; flex-direction: column; gap: 6px; }
.book-row .name { font-family: var(--serif); font-weight: 600; font-size: 1.08rem; display: flex; align-items: center; gap: 6px; }
.chev { color: var(--muted); opacity: 0.6; flex: none; }
.seal { color: var(--accent); }

/* Book screen */
.book-hero { text-align: center; display: flex; flex-direction: column; align-items: center; gap: 8px; padding: 6px 0 18px; }
.book-hero .big-emoji { font-size: 4rem; line-height: 1.1; }
.book-hero h1 { font-family: var(--serif); font-size: 2.1rem; margin: 0; text-wrap: balance; }
.book-hero .bar { width: min(280px, 80%); height: 8px; }
.seg { display: grid; grid-template-columns: 1fr 1fr; background: var(--sunk); border-radius: 10px; padding: 3px; margin-bottom: 16px; }
.seg button { min-height: 36px; border-radius: 8px; font-size: 0.92rem; font-weight: 500; text-align: center; color: var(--muted); }
.seg button[aria-pressed="true"] { background: var(--surface); color: var(--ink); box-shadow: var(--shadow); }
.grid { display: grid; grid-template-columns: repeat(auto-fill, minmax(max(56px, 3.4rem), 1fr)); gap: 10px; padding-top: 6px; }
.tile {
  position: relative; aspect-ratio: 1; max-width: 100%; border-radius: 12px; display: grid; place-items: center;
  border: 1.5px solid var(--line); background: var(--surface); font-weight: 600; font-variant-numeric: tabular-nums;
  transition: background .15s ease, transform .1s ease;
}
.tile:active { transform: scale(0.94); }
.tile .num { display: flex; flex-direction: column; align-items: center; line-height: 1.05; }
.tile.read { background: var(--accent); border-color: var(--accent); color: var(--on-accent); }
.tile .note { position: absolute; right: 5px; bottom: 4px; width: 7px; height: 7px; border-radius: 50%; background: var(--accent); }
.tile.read .note { background: var(--on-accent); }
.tile .badge { position: absolute; top: -7px; right: -7px; font-size: 0.85rem; width: 22px; height: 22px; border-radius: 50%; background: var(--bg); display: grid; place-items: center; }
.crow { display: flex; align-items: center; background: var(--surface); }
.check { width: 52px; min-height: 56px; flex: none; display: grid; place-items: center; color: var(--line); }
.check.on { color: var(--accent); }
.crow-main { flex: 1; min-width: 0; display: flex; align-items: center; gap: 8px; min-height: 56px; padding: 8px 14px 8px 0; }
.crow-main .t { font-family: var(--serif); font-size: 1.05rem; }
.crow-main .col { flex: 1; min-width: 0; display: flex; flex-direction: column; }

/* Chapter screen */
.ch-hero { text-align: center; display: flex; flex-direction: column; align-items: center; gap: 8px; padding: 4px 0 18px; }
.ch-hero .big-emoji { font-size: 4.4rem; line-height: 1.1; }
.ch-hero .caption { color: var(--accent); background: var(--accent-soft); border-radius: 99px; padding: 5px 12px; font-size: 0.9rem; font-weight: 500; }
.ch-hero h1 { font-family: var(--serif); font-size: 2.3rem; margin: 4px 0 0; }
.read-toggle { display: flex; align-items: center; gap: 14px; width: 100%; min-height: 64px; }
.read-toggle .circle { color: var(--line); flex: none; }
.read-toggle.on .circle { color: var(--accent); }
.read-toggle b { display: block; font-size: 1.08rem; }
.kv { display: flex; align-items: center; justify-content: space-between; gap: 12px; min-height: 48px; }
.kv + .kv { border-top: 0.5px solid var(--line); }
input[type="date"] {
  background: var(--sunk); border: 0; border-radius: 9px; padding: 8px 10px; min-height: 40px; color: var(--ink);
  font-variant-numeric: tabular-nums; -webkit-appearance: none; appearance: none;
}
.btn-secondary { display: flex; align-items: center; justify-content: center; gap: 8px; width: 100%; min-height: 46px; border-radius: 12px; background: var(--accent-soft); color: var(--accent); font-weight: 600; margin-top: 10px; }
details.history { margin-top: 12px; }
details.history summary { min-height: 44px; display: flex; align-items: center; font-weight: 500; color: var(--accent); cursor: pointer; list-style: none; }
details.history summary::-webkit-details-marker { display: none; }
.hist-row { display: flex; align-items: center; gap: 10px; min-height: 48px; }
.hist-row span { flex: 1; color: var(--muted); }
.remove { width: 44px; height: 44px; display: grid; place-items: center; color: var(--danger); }
.notes-h { display: flex; justify-content: space-between; align-items: baseline; margin-bottom: 10px; }
.notes-h h2 { font-family: var(--serif); font-size: 1.3rem; margin: 0; font-weight: 600; }
textarea#notes {
  width: 100%; min-height: 260px; resize: vertical; border: 0; border-radius: 12px; padding: 12px;
  background: var(--sunk); color: var(--ink); line-height: 1.5; font-size: 1rem;
}
textarea#notes::placeholder { color: var(--muted); }
.chapter-bar {
  position: fixed; left: 0; right: 0; bottom: calc(58px + env(safe-area-inset-bottom, 0px)); z-index: 6;
  background: var(--bar); -webkit-backdrop-filter: blur(16px); backdrop-filter: blur(16px); border-top: 0.5px solid var(--line);
}
.chapter-bar .in {
  max-width: 600px; margin: 0 auto; display: flex; justify-content: space-between; gap: 12px;
  padding-left: max(12px, env(safe-area-inset-left, 0px)); padding-right: max(12px, env(safe-area-inset-right, 0px));
}
.chapter-bar button { display: inline-flex; align-items: center; gap: 4px; min-height: 48px; color: var(--accent); font-weight: 600; font-size: 0.95rem; max-width: 48%; white-space: nowrap; overflow: hidden; text-overflow: ellipsis; }

/* Tab bar */
.tabbar {
  position: fixed; left: 0; right: 0; bottom: 0; z-index: 7; background: var(--bar);
  -webkit-backdrop-filter: blur(16px); backdrop-filter: blur(16px); border-top: 0.5px solid var(--line);
  padding-bottom: env(safe-area-inset-bottom, 0px);
}
.tabbar .in { max-width: 600px; margin: 0 auto; display: grid; grid-template-columns: repeat(4, 1fr); padding-left: env(safe-area-inset-left, 0px); padding-right: env(safe-area-inset-right, 0px); }
.tab { display: flex; flex-direction: column; align-items: center; justify-content: center; gap: 2px; min-height: 58px; font-size: 0.68rem; font-weight: 500; color: var(--muted); }
.tab[aria-current="page"] { color: var(--accent); }

/* Progress */
.overall { display: flex; flex-direction: column; align-items: center; gap: 18px; }
.overall .pct { font-family: var(--serif); font-size: 2.3rem; font-weight: 700; font-variant-numeric: tabular-nums; }
.statline { width: 100%; display: flex; flex-direction: column; gap: 6px; }
.statline .row { display: flex; align-items: baseline; gap: 8px; }
.statline .row .k { flex: 1; font-weight: 500; }
.statline .row .p { min-width: 3.2em; text-align: right; font-weight: 600; }
.statline .bar { height: 8px; }
.card h2 { font-family: var(--serif); font-size: 1.2rem; font-weight: 600; margin: 0; }
.card-h { display: flex; justify-content: space-between; align-items: baseline; gap: 10px; margin-bottom: 14px; }
.tiles3 { display: grid; grid-template-columns: repeat(3, 1fr); gap: 10px; }
.stat { background: var(--surface); border-radius: var(--radius); padding: 14px 6px; text-align: center; display: flex; flex-direction: column; align-items: center; gap: 2px; box-shadow: var(--shadow); }
.stat .v { font-family: var(--serif); font-size: 1.9rem; font-weight: 700; font-variant-numeric: tabular-nums; line-height: 1.1; }
.stat .ico { color: var(--accent); }
.cal-head { display: flex; align-items: center; gap: 2px; }
.cal-head h2 { flex: 1; }
.cal-head .m { min-width: 6.5em; text-align: center; font-weight: 600; font-size: 0.92rem; }
.cal-grid { display: grid; grid-template-columns: repeat(7, 1fr); gap: 4px; }
.cal-dow { text-align: center; font-size: 0.7rem; font-weight: 600; color: var(--muted); padding-bottom: 2px; }
.day { aspect-ratio: 1; max-width: 100%; border-radius: 8px; display: grid; place-items: center; font-size: 0.8rem; font-variant-numeric: tabular-nums; border: 1.5px solid transparent; }
.day.today { border-color: var(--accent); font-weight: 700; }
.day.sel { border-color: var(--ink); }
.day[disabled] { opacity: 0.35; cursor: default; }
.lv0 { background: color-mix(in srgb, var(--accent-soft) 55%, transparent); }
.lv1 { background: color-mix(in srgb, var(--accent) 30%, transparent); }
.lv2 { background: color-mix(in srgb, var(--accent) 55%, transparent); }
.lv3 { background: color-mix(in srgb, var(--accent) 80%, transparent); color: var(--on-accent); }
.lv4 { background: var(--accent); color: var(--on-accent); }
.legend { display: flex; align-items: center; justify-content: flex-end; gap: 4px; margin-top: 10px; font-size: 0.7rem; color: var(--muted); }
.legend i { width: 12px; height: 12px; border-radius: 3px; display: inline-block; }
.day-detail { border-top: 0.5px solid var(--line); margin-top: 14px; padding-top: 12px; }
.linkrow { display: flex; align-items: center; gap: 10px; width: 100%; min-height: 46px; }
.linkrow .t { flex: 1; font-family: var(--serif); }
.done-grid { display: grid; grid-template-columns: repeat(auto-fill, minmax(76px, 1fr)); gap: 8px; }
.done-grid button { background: var(--accent-soft); border-radius: 12px; min-height: 68px; display: flex; flex-direction: column; align-items: center; justify-content: center; gap: 2px; padding: 6px 4px; }
.done-grid span { font-size: 0.68rem; max-width: 100%; white-space: nowrap; overflow: hidden; text-overflow: ellipsis; }

/* Journal */
.filters { display: flex; gap: 8px; margin-top: 10px; }
.filters select { flex: 1; min-width: 0; min-height: 44px; border: 0; border-radius: 12px; background: var(--sunk); padding: 0 12px; color: var(--ink); }
.jrow { display: flex; gap: 12px; width: 100%; padding: 14px; align-items: flex-start; }
.jrow .emoji-tile { width: 40px; height: 40px; font-size: 1.3rem; border-radius: 10px; }
.jrow .col { flex: 1; min-width: 0; display: flex; flex-direction: column; gap: 4px; }
.jrow .head { display: flex; justify-content: space-between; align-items: baseline; gap: 8px; }
.jrow .head b { font-family: var(--serif); font-size: 1.05rem; }
.jrow .preview { color: var(--muted); font-size: 0.92rem; display: -webkit-box; -webkit-line-clamp: 3; -webkit-box-orient: vertical; overflow: hidden; white-space: pre-line; overflow-wrap: anywhere; }
.pill { display: inline-flex; align-items: center; gap: 4px; font-size: 0.72rem; color: var(--accent); font-weight: 600; }
.empty { text-align: center; padding: 48px 20px; color: var(--muted); display: flex; flex-direction: column; align-items: center; gap: 8px; }
.empty b { color: var(--ink); font-family: var(--serif); font-size: 1.2rem; }

/* Settings */
.set-row { display: flex; align-items: center; justify-content: space-between; gap: 12px; min-height: 52px; padding: 6px 16px; width: 100%; }
.set-row select { border: 0; background: var(--sunk); border-radius: 9px; min-height: 36px; padding: 0 10px; max-width: 55%; color: var(--ink); }
.set-row.act { color: var(--accent); font-weight: 500; justify-content: flex-start; }
.set-row.danger { color: var(--danger); }
.foot { color: var(--muted); font-size: 0.8rem; margin: 8px 16px 0; }
.switch { position: relative; width: 51px; height: 31px; flex: none; }
.switch input { position: absolute; inset: 0; opacity: 0; margin: 0; cursor: pointer; }
.switch i { position: absolute; inset: 0; border-radius: 99px; background: var(--line); transition: background .2s; pointer-events: none; }
.switch i::after { content: ""; position: absolute; top: 2px; left: 2px; width: 27px; height: 27px; border-radius: 50%; background: #fff; box-shadow: 0 1px 3px rgba(0,0,0,.25); transition: transform .2s; }
.switch input:checked + i { background: var(--accent); }
.switch input:checked + i::after { transform: translateX(20px); }
.switch input:focus-visible + i { outline: 2.5px solid var(--accent); outline-offset: 2px; }
.status { display: flex; align-items: flex-start; gap: 10px; padding: 14px 16px; }
.status .dot { margin-top: 6px; }
.dot { width: 10px; height: 10px; border-radius: 50%; flex: none; background: var(--muted); }
.dot.ok { background: #3E8E5A; }
.dot.busy { background: var(--accent); }
.dot.warn { background: var(--danger); }
.howto ol { margin: 6px 0 0; padding-left: 1.3em; display: flex; flex-direction: column; gap: 6px; }
textarea.export { width: 100%; min-height: 160px; border: 0; border-radius: 10px; background: var(--sunk); padding: 10px; font: 0.75rem/1.4 ui-monospace, Menlo, monospace; color: var(--ink); }

/* Sheets, toast, celebration */
.scrim { position: fixed; inset: 0; z-index: 40; background: rgba(20, 14, 6, 0.4); display: flex; align-items: flex-end; justify-content: center; animation: fade .18s ease; }
.sheet {
  width: 100%; max-width: 600px; background: var(--surface); border-radius: 20px 20px 0 0;
  padding: 20px max(16px, env(safe-area-inset-right, 0px)) calc(16px + env(safe-area-inset-bottom, 0px)) max(16px, env(safe-area-inset-left, 0px));
  display: flex; flex-direction: column; gap: 10px; animation: rise .22s ease; max-height: 88vh; overflow-y: auto;
}
.sheet h3 { font-family: var(--serif); font-size: 1.25rem; margin: 0; text-align: center; }
.sheet p { margin: 0 0 6px; color: var(--muted); text-align: center; }
.sheet .opt { min-height: 50px; border-radius: 12px; background: var(--sunk); font-weight: 600; text-align: center; color: var(--accent); }
.sheet .opt.destructive { color: var(--danger); }

  cal: '<svg width="20" height="20" viewBox="0 0 24 24" fill="none" stroke="currentColor" stroke-width="2.2" stroke-linecap="round" aria-hidden="true"><rect x="3.5" y="5" width="17" height="15.5" rx="2.5"/><path d="M3.5 10h17M8 3v4M16 3v4"/></svg>'
};

/* ---------- State ---------- */
const LS_KEY = "everyverse.v1";
const DEFAULT_SETTINGS = { df: "dmy", icons: true, tap: "open", layout: "grid" };
const S = {
  records: {},                 // "b:c" -> { d: ["YYYY-MM-DD", ...] oldest first, n: "notes", e: ISO last edited }
  settings: { ...DEFAULT_SETTINGS },
  tab: "read",
  stacks: { read: [{ v: "home" }], journal: [{ v: "journal" }], progress: [{ v: "progress" }], settings: [{ v: "settings" }] },
  storage: "local",
  homeQ: "", jQ: "", jF: "all",
  calMonth: null, calSel: null,
  notesDraft: null             // { k, text } while typing
};
function cleanSettings(x) {
  const s = { ...DEFAULT_SETTINGS };
  if (x && ["dmy", "mdy", "ymd", "long"].includes(x.df)) s.df = x.df;
  if (x && typeof x.icons === "boolean") s.icons = x.icons;
  if (x && ["open", "mark"].includes(x.tap)) s.tap = x.tap;
  if (x && ["grid", "list"].includes(x.layout)) s.layout = x.layout;
  if (x && typeof x.lastBackup === "string") s.lastBackup = x.lastBackup;
  return s;
}
function cleanRecord(x) {
  if (!x || typeof x !== "object") return null;
  const d = Array.isArray(x.d) ? x.d.filter(isYMD).sort() : [];
  const n = typeof x.n === "string" ? x.n : "";
  const e = typeof x.e === "string" ? x.e : null;
  if (!d.length && !n.trim()) return null;
  return { d, n, e };
}
(function loadLocal() {
  try {
    const raw = JSON.parse(localStorage.getItem(LS_KEY) || "null");
    if (raw && raw.records) {
      for (const [k, v] of Object.entries(raw.records)) {
        const [b, c] = k.split(":").map(Number); const r = cleanRecord(v);
        if (validRef(b, c) && r) S.records[k] = r;
      }
      S.settings = cleanSettings(raw.settings);
    }
  } catch (e) { /* storage unavailable */ }
})();
let saveFailed = false;
function saveLocal() {
  try {
    localStorage.setItem(LS_KEY, JSON.stringify({ records: S.records, settings: S.settings }));
    saveFailed = false;
  } catch (e) {
    if (!saveFailed) toast("Couldn't save on this phone. Check that Safari isn't in Private Browsing.");
    saveFailed = true;
  }
}
const storageWorks = (() => { try { localStorage.setItem("ev.test", "1"); localStorage.removeItem("ev.test"); return true; } catch (e) { return false; } })();

/* ---------- Haptics: a light tap on iPhone (iOS 18+) and Android ---------- */
const hapticEl = (() => {
  try {
    const l = document.createElement("label"); l.setAttribute("aria-hidden", "true"); l.style.display = "none";
    const i = document.createElement("input"); i.type = "checkbox"; i.setAttribute("switch", ""); i.tabIndex = -1;
    l.appendChild(i); document.body.appendChild(l); return l;
  } catch (e) { return null; }
})();
function haptic() {
  try { if (navigator.vibrate) { navigator.vibrate(12); return; } if (hapticEl) hapticEl.click(); } catch (e) { /* not supported */ }
}

/* ---------- Reading data ---------- */
const rec = (b, c) => S.records[key(b, c)];
const isRead = (b, c) => { const r = rec(b, c); return !!(r && r.d.length); };
const lastRead = r => (r && r.d.length ? r.d[r.d.length - 1] : null);
const hasNotes = r => !!(r && r.n && r.n.trim());
const cloneRec = r => (r ? { d: [...r.d], n: r.n, e: r.e } : { d: [], n: "", e: null });
function putRec(b, c, r) {
  const k = key(b, c);
  const clean = cleanRecord(r);
  if (clean) S.records[k] = clean; else delete S.records[k];
  saveLocal();
}
function bookRead(b) { let n = 0; for (let c = 1; c <= BOOKS[b - 1].n; c++) if (isRead(b, c)) n++; return n; }
function bookVersesRead(b) { const bk = BOOKS[b - 1]; let n = 0; for (let c = 1; c <= bk.n; c++) if (isRead(b, c)) n += bk.v[c - 1]; return n; }
function testRead(t) { return TEST[t].books.reduce((a, bk) => a + bookRead(bk.id), 0); }
function testVerses(t) { return TEST[t].books.reduce((a, bk) => a + bookVersesRead(bk.id), 0); }
function totalRead() { let n = 0; for (const [k, r] of Object.entries(S.records)) if (r.d.length) n++; return n; }
function totalVerses() { let n = 0; for (const [k, r] of Object.entries(S.records)) { if (!r.d.length) continue; const [b, c] = k.split(":").map(Number); n += BOOKS[b - 1].v[c - 1]; } return n; }
const booksDone = () => BOOKS.filter(bk => bookRead(bk.id) === bk.n);

function continueTarget() {
  let best = null, bestDate = "", bestIdx = -1;
  for (const [k, r] of Object.entries(S.records)) {
    const d = lastRead(r); if (!d) continue;
    const [b, c] = k.split(":").map(Number); const i = gidx(b, c);
    if (d > bestDate || (d === bestDate && i > bestIdx)) { best = [b, c]; bestDate = d; bestIdx = i; }
  }
  const start = best ? bestIdx : -1;
  for (let off = 1; off <= ALL.length; off++) {
    const [b, c] = ALL[(start + off + ALL.length) % ALL.length];
    if (!isRead(b, c)) return [b, c];
  }
  return [1, 1];
}

function readingDays() {
  const map = {};
  for (const [k, r] of Object.entries(S.records)) for (const d of r.d) { (map[d] = map[d] || new Set()).add(k); }
  return map;
}
function streaks(dayMap, today = todayYMD()) {
  const days = new Set(Object.keys(dayMap));
  let cur = 0, cursor = days.has(today) ? today : (days.has(addDays(today, -1)) ? addDays(today, -1) : null);
  while (cursor && days.has(cursor)) { cur++; cursor = addDays(cursor, -1); }
  const sorted = [...days].sort(); let longest = 0, run = 0, prev = null;
  for (const d of sorted) { run = prev && addDays(prev, 1) === d ? run + 1 : 1; longest = Math.max(longest, run); prev = d; }
  return { current: cur, longest, active: days.size };
}

/* ---------- Actions ---------- */
function logReading(b, c, day = todayYMD()) {
  const r = cloneRec(rec(b, c)); const was = r.d.length > 0;
  r.d.push(day); putRec(b, c, r); haptic();
  if (!was) { const m = milestoneFor(b); if (m) setTimeout(() => celebrate(m), 300); }
}
function markUnread(b, c) { const r = cloneRec(rec(b, c)); r.d = []; putRec(b, c, r); haptic(); }
function changeDate(b, c, oldDay, newDay) {
  if (!isYMD(newDay) || newDay > todayYMD()) { toast("Choose a date that isn't in the future."); refresh(); return; }
  const r = cloneRec(rec(b, c)); const i = r.d.indexOf(oldDay); if (i < 0) return;
  r.d[i] = newDay; putRec(b, c, r);
}
function removeReading(b, c, day) { const r = cloneRec(rec(b, c)); const i = r.d.indexOf(day); if (i < 0) return; r.d.splice(i, 1); putRec(b, c, r); }
function markAllRead(b) {
  const today = todayYMD(); let any = false;
  for (let c = 1; c <= BOOKS[b - 1].n; c++) if (!isRead(b, c)) { const r = cloneRec(rec(b, c)); r.d = [today]; putRec(b, c, r); any = true; }
  if (any) { const m = milestoneFor(b); if (m) setTimeout(() => celebrate(m), 300); }
}
function milestoneFor(b) {
  const bk = BOOKS[b - 1];
  if (bookRead(b) < bk.n) return null;
  if (totalRead() >= TOTAL_CH) return { k: "bible" };
  if (testRead(bk.t) === TEST[bk.t].ch) return { k: "test", t: bk.t };
  return { k: "book", b };
}
let notesTimer = null;
function notesInput(b, c, text) {
  S.notesDraft = { k: key(b, c), text };
  clearTimeout(notesTimer);
  notesTimer = setTimeout(flushNotes, 600);
}
function flushNotes() {
  clearTimeout(notesTimer); notesTimer = null;
  const d = S.notesDraft; if (!d) return;
  S.notesDraft = null;
  const [b, c] = d.k.split(":").map(Number);
  const r = cloneRec(rec(b, c));
  if (r.n === d.text) return;
  r.n = d.text; r.e = new Date().toISOString();
  putRec(b, c, r);
  const le = $("#lastEdited"); if (le) le.textContent = lastEditedText(b, c);
}
document.addEventListener("visibilitychange", () => { if (document.visibilityState === "hidden") flushNotes(); });
window.addEventListener("pagehide", flushNotes);

/* ---------- Navigation ---------- */
const curView = () => S.stacks[S.tab][S.stacks[S.tab].length - 1];
function push(view) { flushNotes(); curView().y = window.scrollY; S.stacks[S.tab].push(view); render(); window.scrollTo(0, 0); }
function pop() { flushNotes(); const st = S.stacks[S.tab]; if (st.length > 1) st.pop(); render(); window.scrollTo(0, curView().y || 0); }
function switchTab(tab) {
  flushNotes();
  if (S.tab === tab) { S.stacks[tab].length = 1; render(); window.scrollTo(0, 0); return; }
  curView().y = window.scrollY; S.tab = tab; render(); window.scrollTo(0, curView().y || 0);
}
function openChapterFromAnywhere(b, c) {
  flushNotes(); curView().y = window.scrollY;
  S.tab = "read"; S.stacks.read = [{ v: "home" }, { v: "book", b }, { v: "chapter", b, c }];
  render(); window.scrollTo(0, 0);
}
function goChapter(b, c) { flushNotes(); const t = curView(); t.b = b; t.c = c; render(); window.scrollTo(0, 0); }

/* ---------- Rendering ---------- */
function render() {
  const focus = document.activeElement && document.activeElement.id ? document.activeElement.id : null;
  let sel = null;
  if (focus && /^(home-q|j-q)$/.test(focus)) { const el = document.activeElement; sel = [el.selectionStart, el.selectionEnd]; }
  const v = curView();
  const view = $("#view");
  view.classList.toggle("has-chapter-bar", v.v === "chapter");
  view.innerHTML = ({
    home: renderHome, book: renderBook, chapter: renderChapter,
    journal: renderJournal, progress: renderProgress, settings: renderSettings
  })[v.v](v);
  $("#chbar").innerHTML = v.v === "chapter" ? renderChapterBar(v.b, v.c) : "";
  renderTabs();
  if (focus) { const el = document.getElementById(focus); if (el && el.id !== "notes") { el.focus({ preventScroll: true }); if (sel) try { el.setSelectionRange(sel[0], sel[1]); } catch (e) {} } }
}
/** Gentle update after data changes, without disturbing typing in notes. */
function refresh() {
  const v = curView();
  if (v.v === "chapter") {
    const card = $("#readCard"); if (card) card.outerHTML = renderReadCard(v.b, v.c);
    const le = $("#lastEdited"); if (le) le.textContent = lastEditedText(v.b, v.c);
    const ta = $("#notes"); const r = rec(v.b, v.c);
    if (ta && document.activeElement !== ta && !S.notesDraft && ta.value !== (r ? r.n : "")) ta.value = r ? r.n : "";
    return;
  }
  const y = window.scrollY; render(); window.scrollTo(0, y);
}
function renderTabs() {
  const tabs = [["read", "Read", ICON.book], ["journal", "Journal", ICON.pen], ["progress", "Progress", ICON.chart], ["settings", "Settings", ICON.gear]];
  $("#tabs").innerHTML = tabs.map(([id, label, icon]) =>
    `<button class="tab" data-act="tab" data-tab="${id}" ${S.tab === id ? 'aria-current="page"' : ""}>${icon}<span>${label}</span></button>`).join("");
}
function topbar(backLabel, title, right = "") {
  return `<div class="topbar">
    <div>${backLabel ? `<button class="back" data-act="back">${ICON.back}<span>${esc(backLabel)}</span></button>` : ""}</div>
    <div class="title">${esc(title)}</div>
    <div class="right">${right}</div>
  </div>`;
}
const bar = (f, h) => `<div class="bar"${h ? ` style="height:${h}px"` : ""}><i style="width:${Math.max(0, Math.min(100, f * 100))}%"></i></div>`;
function ring(f, size, stroke, inner) {
  const r = (size - stroke) / 2, circ = 2 * Math.PI * r, off = circ * (1 - Math.max(0, Math.min(1, f)));
  return `<div class="ring" style="width:${size}px;height:${size}px">
    <svg width="${size}" height="${size}" viewBox="0 0 ${size} ${size}" aria-hidden="true"><circle class="track" cx="${size / 2}" cy="${size / 2}" r="${r}" stroke-width="${stroke}"/><circle class="val" cx="${size / 2}" cy="${size / 2}" r="${r}" stroke-width="${stroke}" stroke-dasharray="${circ}" stroke-dashoffset="${off}"/></svg>
    ${inner}</div>`;
}

/* Home */
function renderHome() {
  const read = totalRead(), f = read / TOTAL_CH;
  const [tb, tc] = continueTarget();
  const done = read >= TOTAL_CH;
  return `<h1 class="large">Every Verse</h1>
  <div class="card continue">
    <div class="top">
      ${ring(f, 66, 7, `<span class="small tnum" style="font-weight:700">${pctText(f)}</span>`)}
      <div style="min-width:0">
        <h2>${read ? "Your progress" : "Begin your journey"}</h2>
        <div class="muted small tnum">${fmtN(read)} of ${fmtN(TOTAL_CH)} chapters read</div>
      </div>
    </div>
    <button class="btn-primary" data-act="continue" data-b="${tb}" data-c="${tc}">
      ${ICON.book}<span class="lbl"><small>${done ? "Read again" : read ? "Continue reading" : "Start reading"}</small><b>${esc(chTitle(tb, tc))}</b></span>${ICON.next}
    </button>
  </div>
  <label class="search">${ICON.search}<span class="sr">Find a book</span><input id="home-q" type="search" placeholder="Find a book" value="${esc(S.homeQ)}" autocomplete="off"></label>
  <div id="home-books">${renderHomeBooks()}</div>`;
}
function renderHomeBooks() {
  const q = S.homeQ.trim().toLowerCase();
  let html = "";
  for (const t of Object.values(TEST)) {
    const books = t.books.filter(bk => !q || bk.name.toLowerCase().includes(q));
    if (!books.length) continue;
    html += `<section><div class="sec-h"><h2>${t.name}</h2><span class="small tnum">${fmtN(testRead(t.key))} / ${fmtN(t.ch)}</span></div><div class="group">`;
    for (const bk of books) {
      const n = bookRead(bk.id);
      html += `<button class="book-row" data-act="book" data-b="${bk.id}">
        <span class="emoji-tile" aria-hidden="true">${bk.icon}</span>
        <span class="mid"><span class="name">${esc(bk.name)}${n === bk.n ? ICON.seal : ""}</span>${bar(n / bk.n)}<span class="muted small tnum">${n} of ${bk.n} chapters read</span></span>
        ${ICON.chev}</button>`;
    }
    html += `</div></section>`;
  }
  return html || `<div class="empty"><b>No book called “${esc(S.homeQ)}”</b><span>Check the spelling, or try a shorter name like “Cor”.</span></div>`;
}

/* Book */
function renderBook(v) {
  const bk = BOOKS[v.b - 1], n = bookRead(bk.id);
  const right = `<button class="iconbtn" data-act="book-menu" data-b="${bk.id}" aria-label="More options">${ICON.more}</button>`;
  let body = "";
  if (S.settings.layout === "grid") {
    body = `<div class="grid">`;
    for (let c = 1; c <= bk.n; c++) {
      const r = rec(bk.id, c), read = !!(r && r.d.length), hl = S.settings.icons ? HL[key(bk.id, c)] : null;
      const label = [`Chapter ${c}`, read ? "read" : "not read", hasNotes(r) ? "has notes" : "", hl ? hl.cap : ""].filter(Boolean).join(", ");
      body += `<button class="tile${read ? " read" : ""}" data-act="tile" data-b="${bk.id}" data-c="${c}" aria-label="${esc(label)}">
        <span class="num">${c}${read ? ICON.check : ""}</span>${hasNotes(r) ? '<span class="note"></span>' : ""}${hl ? `<span class="badge" aria-hidden="true">${hl.icon}</span>` : ""}</button>`;
    }
    body += `</div>`;
  } else {
    body = `<div class="group">`;
    for (let c = 1; c <= bk.n; c++) {
      const r = rec(bk.id, c), read = !!(r && r.d.length), hl = S.settings.icons ? HL[key(bk.id, c)] : null;
      const sub = read ? `Read ${fmtDate(lastRead(r))}${r.d.length > 1 ? " · " + r.d.length + "×" : ""}` : (hl ? hl.cap : "");
      body += `<div class="crow">
        <button class="check${read ? " on" : ""}" data-act="toggle" data-b="${bk.id}" data-c="${c}" aria-label="${read ? "Mark " + esc(chTitle(bk.id, c)) + " as unread" : "Mark " + esc(chTitle(bk.id, c)) + " as read"}">${read ? ICON.circleOn : ICON.circle}</button>
        <button class="crow-main" data-act="chapter" data-b="${bk.id}" data-c="${c}">
          <span class="col"><span class="t">${esc(chTitle(bk.id, c))}${hl ? " " + hl.icon : ""}</span>${sub ? `<span class="muted small tnum">${esc(sub)}</span>` : ""}</span>
          ${hasNotes(r) ? `<span class="seal">${ICON.note}</span>` : ""}${ICON.chev}
        </button></div>`;
    }
    body += `</div>`;
  }
  return `${topbar("Read", bk.name, right)}
  <div class="book-hero">
    <div class="big-emoji" aria-hidden="true">${bk.icon}</div>
    <h1>${esc(bk.name)}</h1>
    <div class="muted tnum">${n} of ${bk.n} chapters read</div>
    ${bar(n / bk.n, 8)}
    <div class="muted small tnum">${fmtN(bookVersesRead(bk.id))} of ${fmtN(bk.verses)} verses · ${TEST[bk.t].name}</div>
  </div>
  <div class="seg" role="group" aria-label="Layout">
    <button data-act="layout" data-l="grid" aria-pressed="${S.settings.layout === "grid"}">Grid</button>
    <button data-act="layout" data-l="list" aria-pressed="${S.settings.layout === "list"}">List</button>
  </div>
  ${body}`;
}

/* Chapter */
function lastEditedText(b, c) {
  const r = rec(b, c);
  return hasNotes(r) && r.e ? "Last edited " + fmtDateTime(r.e) : "Notes save automatically as you type.";
}
function renderChapter(v) {
  const { b, c } = v, bk = BOOKS[b - 1], r = rec(b, c);
  const hl = S.settings.icons ? HL[key(b, c)] : null;
  return `${topbar(bk.name, chTitle(b, c))}
  <div class="ch-hero">
    ${hl ? `<div class="big-emoji" aria-hidden="true">${hl.icon}</div><div class="caption">${esc(hl.cap)}</div>` : `<div class="big-emoji" style="font-size:2.8rem" aria-hidden="true">${bk.icon}</div>`}
    <h1>${esc(chTitle(b, c))}</h1>

  </div>
  <div class="stack">

      <label class="sr" for="notes">Notes for ${esc(chTitle(b, c))}</label>
      <textarea id="notes" data-b="${b}" data-c="${c}" placeholder="Reflections, prayers, questions, key verses…">${esc(r ? r.n : "")}</textarea>
      <div id="lastEdited" class="muted small" style="margin-top:8px">${esc(lastEditedText(b, c))}</div>
    </div>
  </div>`;
}
function renderReadCard(b, c) {
  const r = rec(b, c), read = !!(r && r.d.length), last = lastRead(r), today = todayYMD();
  const sub = !read ? "Tick when you've read this chapter" : r.d.length > 1 ? `Last read ${fmtDate(last)} · ${r.d.length} times` : `Read on ${fmtDate(last)}`;
  let html = `<div class="card" id="readCard">
    <button class="read-toggle${read ? " on" : ""}" data-act="toggle" data-b="${b}" data-c="${c}" aria-label="${read ? "Read. Tap to mark as unread." : "Not read. Tap to mark as read."}">
      <span class="circle">${read ? ICON.bigOn : ICON.bigCircle}</span>
      <span><b>${read ? "Read" : "Mark as read"}</b><span class="muted small tnum">${esc(sub)}</span></span>
    </button>`;
  if (read) {

      notes: r.n, notesLastEdited: r.e ? new Date(r.e).toISOString().replace(/\.\d{3}Z$/, "Z") : null

}
function textJournal() {
  const L = ["EVERY VERSE: READING JOURNAL", "Exported " + fmtDateTime(new Date().toISOString()), "",
    `Chapters read: ${fmtN(totalRead())} of ${fmtN(TOTAL_CH)}`, `Verses read: ${fmtN(totalVerses())} of ${fmtN(TOTAL_V)}`, `Books completed: ${booksDone().length} of 66`];

async function offerFile(filename, data, type) {
  const blob = new Blob([data], { type });
  try {
    const file = new File([blob], filename, { type });
    if (navigator.canShare && navigator.canShare({ files: [file] })) {
      await navigator.share({ files: [file], title: filename });
      return true;
    }
  } catch (e) {
    if (e && e.name === "AbortError") return false;
  }
  try {
    const url = URL.createObjectURL(blob);
    const a = document.createElement("a"); a.href = url; a.download = filename; a.rel = "noopener";
    document.body.appendChild(a); a.click(); a.remove();
    setTimeout(() => URL.revokeObjectURL(url), 5000);
    toast("Saved " + filename);
    return true;
  } catch (e) {
    toast("This browser couldn't save the file.");
    return false;
  }
}

  const ok = await offerFile(`Every Verse Backup ${todayYMD()}.json`, backupJSON(), "application/json");
  if (ok) { S.settings.lastBackup = new Date().toISOString(); saveSettings(); if (curView().v === "settings") refresh(); }
}

  let cur = 0;

    h += `<h3>${esc(chTitle(b, c))}</h3><p class="pm">${r.d.length ? (r.d.length === 1 ? "Read " : `Read ${r.d.length} times: `) + esc(r.d.map(fmtDate).join(", ")) : "Not read yet"}</p>`;

function parseBackup(text) {
  const x = JSON.parse(text);
  if (!x || x.app !== "Every Verse" || !Array.isArray(x.chapters)) throw new Error("not every verse");
  const items = [];
  for (const ch of x.chapters) {
    const b = Number(ch.bookID), c = Number(ch.chapter);
    if (!validRef(b, c)) continue;
    const d = (Array.isArray(ch.readDates) ? ch.readDates : []).map(s => { if (isYMD(s)) return s; const t = new Date(s); return isNaN(t) ? null : ymdOf(t); }).filter(Boolean);
    items.push({ b, c, d, n: typeof ch.notes === "string" ? ch.notes : "", e: ch.notesLastEdited ? new Date(ch.notesLastEdited).toISOString() : null });
  }
  return { exportedAt: x.exportedAt, items };
}
function restore(backup, mode) {
  if (mode === "replace") for (const k of Object.keys(S.records)) { const [b, c] = k.split(":").map(Number); putRec(b, c, null); }
  let n = 0;
  for (const it of backup.items) {
    const r = cloneRec(rec(it.b, it.c));
    for (const d of it.d) if (!r.d.includes(d)) r.d.push(d);
    if (it.n.trim() && (!hasNotes(r) || (it.e || "") >= (r.e || ""))) { r.n = it.n; r.e = it.e || new Date().toISOString(); }
    putRec(it.b, it.c, r); n++;
  }
  render();
  toast(`Backup restored: ${plural(n, "chapter")}`);
}

  let e, t, msg, quote = "";
  if (m.k === "book") { const bk = BOOKS[m.b - 1]; e = bk.icon; t = `You finished ${bk.name}!`; msg = bk.n === 1 ? `All ${fmtN(bk.verses)} verses, read.` : `All ${bk.n} chapters and ${fmtN(bk.verses)} verses, read.`; }
  else if (m.k === "test") { const tt = TEST[m.t]; e = m.t === "o" ? "📜" : "🕊️"; t = `You finished the ${tt.name}!`; msg = `${tt.books.length} books, ${fmtN(tt.ch)} chapters and ${fmtN(tt.verses)} verses. What a journey.`; }
  else { e = "🏆"; t = "You read the whole Bible!"; msg = "All 66 books, 1,189 chapters and 31,102 verses. Every verse."; quote = "“I have fought a good fight, I have finished my course, I have kept the faith.” 2 Timothy 4:7"; }
  const ov = $("#overlay");
  ov.innerHTML = `<div class="celebrate" role="dialog" aria-modal="true" aria-label="${esc(t)}"><canvas id="confetti"></canvas>
    <div class="e" aria-hidden="true">${e}</div><h2>${esc(t)}</h2><p>${esc(msg)}</p>${quote ? `<blockquote>${esc(quote)}</blockquote>` : ""}
    <button class="btn-primary" data-act="close-celebrate" style="justify-content:center"><span>Continue</span></button></div>`;
  ov.querySelector(".btn-primary").focus({ preventScroll: true });
  if (!matchMedia("(prefers-reduced-motion: reduce)").matches) confetti($("#confetti"));
}
function confetti(cv) {
  const dpr = window.devicePixelRatio || 1, W = cv.clientWidth, H = cv.clientHeight;
  cv.width = W * dpr; cv.height = H * dpr; const ctx = cv.getContext && cv.getContext("2d"); if (!ctx) return; ctx.scale(dpr, dpr);
  const accent = getComputedStyle(document.documentElement).getPropertyValue("--accent").trim() || "#8A5A20";
  const colors = [accent, "#E8B04B", "#E07A5F", "#81B29A", "#F2CC8F", "#7FA7C9"];
  const P = Array.from({ length: 110 }, () => ({ x: Math.random() * W, y: -20 - Math.random() * H * 0.6, s: 6 + Math.random() * 6, vy: 1.6 + Math.random() * 2.4, vx: -1 + Math.random() * 2, r: Math.random() * 6, vr: -0.15 + Math.random() * 0.3, c: colors[(Math.random() * colors.length) | 0] }));
  const t0 = performance.now();
  (function frame(t) {
    if (!cv.isConnected) return;
    ctx.clearRect(0, 0, W, H);
    let alive = false;
    for (const p of P) {
      p.y += p.vy; p.x += p.vx + Math.sin((t - t0) / 400 + p.r) * 0.6; p.r += p.vr;
      if (p.y < H + 20) alive = true;
      ctx.save(); ctx.translate(p.x, p.y); ctx.rotate(p.r); ctx.fillStyle = p.c; ctx.fillRect(-p.s / 2, -p.s / 4, p.s, p.s / 2); ctx.restore();
    }
    if (alive && t - t0 < 7000) requestAnimationFrame(frame);
  })(t0);
}

/* ---------- Events ---------- */
const ACT = {
  tab: el => switchTab(el.dataset.tab),
  back: () => pop(),
  book: el => push({ v: "book", b: +el.dataset.b }),
  "book-any": el => { S.tab = "read"; S.stacks.read = [{ v: "home" }]; push({ v: "book", b: +el.dataset.b }); },
  chapter: el => push({ v: "chapter", b: +el.dataset.b, c: +el.dataset.c }),
  "chapter-any": el => openChapterFromAnywhere(+el.dataset.b, +el.dataset.c),
  continue: el => openChapterFromAnywhere(+el.dataset.b, +el.dataset.c),
  tile: el => {
    const b = +el.dataset.b, c = +el.dataset.c;
    if (S.settings.tap === "mark" && !isRead(b, c)) { logReading(b, c); refresh(); }
    else push({ v: "chapter", b, c });
  },
  toggle: el => {
    const b = +el.dataset.b, c = +el.dataset.c;
    if (isRead(b, c)) confirmUntick(b, c); else { logReading(b, c); refresh(); }
  },
  again: el => { logReading(+el.dataset.b, +el.dataset.c); refresh(); toast("Logged another reading"); },
  remove: el => { removeReading(+el.dataset.b, +el.dataset.c, el.dataset.d); refresh(); },
  goch: el => goChapter(+el.dataset.b, +el.dataset.c),
  layout: el => { S.settings.layout = el.dataset.l; saveSettings(); refresh(); },
  "book-menu": el => {
    const b = +el.dataset.b, bk = BOOKS[b - 1], left = bk.n - bookRead(b);
    sheet({ title: bk.name, message: left ? `${plural(left, "chapter")} still unread.` : "Every chapter is read.", actions: [
      ...(left ? [{ label: `Mark all ${plural(left, "chapter")} as read`, style: "", fn: () => sheet({
        title: `Mark every chapter of ${bk.name} as read?`, message: "Unread chapters will be dated today. You can change any date afterwards.",
        actions: [{ label: "Mark as read", style: "primary", fn: () => { markAllRead(b); refresh(); } }, { label: "Cancel", style: "cancel" }] }), keep: true }] : []),
      { label: "Close", style: "cancel" }] });
  },
  month: el => {
    const [y, m] = S.calMonth.split("-").map(Number); const d = new Date(y, m - 1 + Number(el.dataset.dir), 1);
    S.calMonth = d.getFullYear() + "-" + pad(d.getMonth() + 1); S.calSel = ""; refresh();
  },
  day: el => { S.calSel = el.dataset.d; refresh(); },
  "export-json": () => exportBackup(),
  "export-pdf": () => printJournal(),
  "export-txt": () => offerFile(`Every Verse Journal ${todayYMD()}.txt`, textJournal(), "text/plain"),
  reset: () => sheet({ title: "Reset progress", message: "Choose what to reset. You'll be asked to confirm again.", actions: [
    { label: "Reset reading progress, keep notes", style: "destructive", keep: true, fn: () => confirmReset(true) },
    { label: "Erase everything, including notes", style: "destructive", keep: true, fn: () => confirmReset(false) },
    { label: "Cancel", style: "cancel" }] }),
  "sheet-opt": el => {
    const acts = $("#overlay")._actions || []; const a = acts[+el.dataset.i];
    if (!a) return closeSheet();
    if (!a.keep) closeSheet();
    if (a.fn) a.fn();
  },
  scrim: (el, e) => { if (e.target === el) closeSheet(); },
  "close-celebrate": () => { $("#overlay").innerHTML = ""; }
};
function confirmReset(keepNotes) {
  sheet({ title: "Are you absolutely sure?", message: keepNotes
      ? "Every read date will be removed. Your notes stay. This can't be undone. Consider exporting a backup first."
      : "All read dates and all notes will be deleted. This can't be undone. Consider exporting a backup first.",
    actions: [{ label: keepNotes ? "Reset progress" : "Erase everything", style: "destructive", fn: () => {
      for (const [k, r] of Object.entries(S.records)) { const [b, c] = k.split(":").map(Number); putRec(b, c, keepNotes ? { d: [], n: r.n, e: r.e } : null); }
      render(); toast(keepNotes ? "Reading progress reset" : "Everything erased");
    } }, { label: "Cancel", style: "cancel" }] });
}
document.addEventListener("click", e => {
  const el = e.target.closest("[data-act]");
  if (!el || el.disabled) return;
  const fn = ACT[el.dataset.act];
  if (fn) fn(el, e);
});
document.addEventListener("change", e => {
  const el = e.target, k = el.dataset && el.dataset.change; if (!k) return;
  if (k === "date") {
    if (!el.value) { refresh(); return; }
    changeDate(+el.dataset.b, +el.dataset.c, el.dataset.old, el.value);
    refresh();
  } else if (k === "df") { S.settings.df = el.value; saveSettings(); }
  else if (k === "icons") { S.settings.icons = el.checked; saveSettings(); }
  else if (k === "tap") { S.settings.tap = el.value; saveSettings(); }
  else if (k === "jfilter") { S.jF = el.value; render(); }
  else if (k === "import") {
    const file = el.files && el.files[0]; if (!file) return;
    const reader = new FileReader();
    reader.onload = () => {
      el.value = "";
      let backup;
      try { backup = parseBackup(String(reader.result)); }
      catch (err) { sheet({ title: "Couldn't import", message: "This file isn't an Every Verse backup. Choose a JSON file exported from Every Verse.", actions: [{ label: "OK", style: "cancel" }] }); return; }
      const when = backup.exportedAt ? fmtDateTime(backup.exportedAt) : "an unknown date";
      sheet({ title: "Restore this backup?", message: `Backup from ${when} with ${plural(backup.items.length, "chapter")}. Replacing deletes your current reading log and notes first. Merging keeps both.`, actions: [
        { label: "Replace everything", style: "destructive", fn: () => restore(backup, "replace") },
        { label: "Merge with what's here", style: "primary", fn: () => restore(backup, "merge") },
        { label: "Cancel", style: "cancel" }] });
    };
    reader.onerror = () => toast("That file couldn't be read.");
    reader.readAsText(file);
  }
});
document.addEventListener("input", e => {
  const el = e.target;
  if (el.id === "notes") notesInput(+el.dataset.b, +el.dataset.c, el.value);
  else if (el.id === "home-q") { S.homeQ = el.value; $("#home-books").innerHTML = renderHomeBooks(); }
  else if (el.id === "j-q") { S.jQ = el.value; render(); }
});
document.addEventListener("toggle", e => { if (e.target.matches && e.target.matches("details[data-hist]")) S.histOpen = e.target.open; }, true);
document.addEventListener("keydown", e => {
  if (e.key === "Escape" && $("#overlay").innerHTML) { $("#overlay").innerHTML = ""; }
});
/* Swipe between chapters */
let touch = null;
document.addEventListener("touchstart", e => {
  if (curView().v !== "chapter" || e.touches.length !== 1 || $("#overlay").innerHTML) { touch = null; return; }
  if (e.target.closest("textarea, input, select, details")) { touch = null; return; }
  const t = e.touches[0]; touch = { x: t.clientX, y: t.clientY };
}, { passive: true });
document.addEventListener("touchend", e => {
  if (!touch) return;
  const t = e.changedTouches[0], dx = t.clientX - touch.x, dy = t.clientY - touch.y, sx = touch.x; touch = null;
  if (sx < 30 || Math.abs(dx) < 70 || Math.abs(dx) < Math.abs(dy) * 2) return;
  const v = curView(), target = dx < 0 ? nextRef(v.b, v.c) : prevRef(v.b, v.c);
  if (target) goChapter(target[0], target[1]);
}, { passive: true });

/* ---------- Start ---------- */
render();
try { if (navigator.storage && navigator.storage.persist) navigator.storage.persist(); } catch (e) { /* optional */ }
if ("serviceWorker" in navigator && /^https?:$/.test(location.protocol)) {
  window.addEventListener("load", () => { navigator.serviceWorker.register("sw.js").catch(() => {}); });
}
// Keep "today" correct if the app stays open past midnight.
document.addEventListener("visibilitychange", () => { if (document.visibilityState === "visible") refresh(); });
</script>
</body>
